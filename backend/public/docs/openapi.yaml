openapi: 3.1.0
info:
  title: PMIS API
  version: 1.0.0
  description: |
    REST API of the Port Management Information System (Map Ta Phut Industrial Port).

    **Envelope.** Every success body is `{ "data": ... }`. Every failure is
    `{ "error": { "message": "<Thai>", "translation": "<English or i18n key>", "code": "<snake_case>" } }`.

    **Lists** return `{ "data": { "data": [...], "totalItems": n, "totalPages": n } }` and accept
    `page`, `limit` (`-1` or `0` = all), `search` and `Order` (a JSON array `[{ "column": "...", "dir": "asc|desc" }]`).

    **Auth.** `POST /auth/login` (or `POST /auth/demo`) returns an access token (1 h) and a refresh token (7 d).
    Send `Authorization: Bearer <access_token>`; when it expires call `POST /auth/refresh` with `{ "refresh_token" }`.
    Report downloads also accept `?token=<access_token>` so a workbook can be opened in a new tab.

    The same operations are available through GraphQL at `/graphql` (explorer at `/altair/`).
servers:
  - url: http://localhost:4100/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Account
  - name: Options
  - name: Master data
  - name: Users & roles
  - name: Vessels
  - name: Request forms
  - name: VTMS
  - name: Vessel in-out
  - name: Port dues
  - name: Contracts
  - name: Surveys
  - name: AIS
  - name: Reports
  - name: Files
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page: { name: page, in: query, schema: { type: integer, default: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, default: 10 }, description: "-1 or 0 returns everything" }
    search: { name: search, in: query, schema: { type: string } }
    order: { name: Order, in: query, schema: { type: string }, description: 'JSON array, e.g. [{"column":"createAt","dir":"desc"}]' }
    id: { name: id, in: path, required: true, schema: { type: integer } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string, description: Thai message }
            translation: { type: string, description: English message or i18n key (email_already_exist, duplicate, ...) }
            code: { type: string }
    Token:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    Profile:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        fullName: { type: string }
        type: { type: string, enum: [SuperAdmin, Admin, User, Agency] }
        roleId: { type: integer, nullable: true }
        roleName: { type: string }
        roleType: { type: string, description: SuperAdmin | Admin | Agency | DocumentReviewer | DocumentApprove | DocumentBerthOfficerMIT | DocumentBerthOfficerTCT | DocumentBerthOfficerSpacial | StatOfficer | StatApprove | VTMS }
        company: { type: string }
        isAcceptedTerm: { type: boolean }
        isFirstLogin: { type: boolean }
        isDemo: { type: boolean }
        uploadFiles: { type: array, items: { $ref: '#/components/schemas/UploadFile' } }
    LoginResult:
      type: object
      properties:
        token: { $ref: '#/components/schemas/Token' }
        user: { $ref: '#/components/schemas/Profile' }
    UploadFile:
      type: object
      properties:
        id: { type: integer }
        fileName: { type: string }
        filePath: { type: string, description: Public URL (local /uploads or Cloudflare R2) }
        preview: { type: string }
        extension: { type: string }
        size: { type: integer }
        fileType: { type: string }
        document_file_type: { type: string }
    Page:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        totalItems: { type: integer }
        totalPages: { type: integer }
    DocumentListItem:
      type: object
      properties:
        id: { type: integer }
        docNumber: { type: string }
        status: { type: string, enum: [Draft, PendingReview, PendingApproval, PendingConfirmation, PendingConfirmation1, PendingConfirmation2, PendingEdit, Approved, Canceled, AdminCanceled] }
        statusDes: { type: string }
        vesselName: { type: string }
        imoNumber: { type: string }
        officialNumber: { type: string }
        grt: { type: number }
        eta: { type: string, format: date-time, nullable: true }
        berthNames: { type: string }
        vesselStatus: { type: string, enum: [PendingBerth, Berth] }
        agencyName: { type: string }
        createAt: { type: string, format: date-time }
    DocumentVessel:
      type: object
      properties:
        vesselId: { type: integer }
        vesselName: { type: string }
        vesselFlagId: { type: integer }
        vesselTypeId: { type: integer }
        vesselImoNumber: { type: string }
        vesselOfficialNumber: { type: string }
        vesselCallSign: { type: string }
        vesselGrossTonnage: { type: number }
        vesselNetTonnage: { type: number }
        vesselLoadWeight: { type: number }
        vesselLengthOverall: { type: number }
        vesselBreadthExtreme: { type: number }
        vesselDepth: { type: number }
        vesselUploadFiles: { type: array, items: { $ref: '#/components/schemas/UploadFile' } }
    DocumentBerth:
      type: object
      properties:
        berthId: { type: integer }
        berthType: { type: string, enum: [MIT, TCT, Spacial, Other] }
        purposeTypeId: { type: integer }
        purposeId: { type: integer }
        cargoTypeId: { type: integer }
        passengers: { type: integer }
        estimatedArrival: { type: string, format: date-time }
        estimatedDeparture: { type: string, format: date-time }
        note: { type: string }
        sequence: { type: integer }
    DocumentProduct:
      type: object
      properties:
        purposeId: { type: integer }
        productTypeId: { type: integer }
        productGroupId: { type: integer }
        cargoWharfageId: { type: integer }
        mTonQty: { type: number }
        rTonQty: { type: number }
        packageAmount: { type: integer }
        receiver: { type: string }
        cargoOwnerId: { type: integer }
    Invoice:
      type: object
      properties:
        customerId: { type: integer, nullable: true }
        name: { type: string }
        taxId: { type: string }
        contactName: { type: string }
        paymentMethodId: { type: integer }
        paymentTermId: { type: integer }
        countryId: { type: integer, description: Thailand is 219 }
        provinceId: { type: integer }
        districtId: { type: integer }
        subDistrictId: { type: integer }
        postCode: { type: string }
        stageProvince: { type: string }
        address: { type: string }
    Document:
      type: object
      properties:
        id: { type: integer }
        docNumber: { type: string }
        status: { type: string }
        statusDescription: { type: string }
        vesselStatus: { type: string }
        rejectedNote: { type: array, items: { type: object, properties: { date: { type: string }, message: { type: string } } } }
        vessel: { $ref: '#/components/schemas/DocumentVessel' }
        invoice: { $ref: '#/components/schemas/Invoice' }
        berths: { type: array, items: { allOf: [{ $ref: '#/components/schemas/DocumentBerth' }, { type: object, properties: { id: { type: integer }, products: { type: array, items: { $ref: '#/components/schemas/DocumentProduct' } }, files: { type: array, items: { $ref: '#/components/schemas/UploadFile' } } } }] } }
        spacialBerths: { type: array, items: { type: object } }
        vesselDocuments: { type: array, items: { $ref: '#/components/schemas/UploadFile' } }
        canApprove: { type: boolean, description: True when the caller's berth office still has to confirm this request }
        isNewShip: { type: boolean }
    Vessel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        owner: { type: string }
        imoNumber: { type: string }
        officialNumber: { type: string }
        callSign: { type: string }
        grossTonnage: { type: number }
        vesselFlagId: { type: integer, description: Thailand is 218 }
        vesselTypeId: { type: integer }
        uploadFiles: { type: array, items: { $ref: '#/components/schemas/UploadFile' } }
    LogBookInput:
      type: object
      properties:
        vesselType: { type: string, description: '"government" to log a government vessel from vessel-government' }
        document_berth_id: { type: integer }
        vessel_id: { type: integer }
        gross_tonnage: { type: number }
        depth: { type: number }
        voyage: { type: string }
        port_id_last: { type: integer }
        port_id_next: { type: integer }
        details:
          type: array
          items:
            type: object
            properties:
              type_doc: { type: string, enum: [Arrival, Departure] }
              berth_id: { type: integer }
              jetty_id: { type: integer }
              purpose_id: { type: integer }
              cargo_type_id: { type: integer }
              cargo_wharfage_id: { type: integer }
              mooring_date: { type: string, format: date-time }
              departure_date: { type: string, format: date-time }
        tugs: { type: array, items: { type: object, properties: { id: { type: integer }, tug_id: { type: integer }, is_delete: { type: boolean } } } }
        pilots: { type: array, items: { type: object, properties: { id: { type: integer }, pilot_id: { type: integer }, is_delete: { type: boolean } } } }
        products: { type: array, items: { type: object, properties: { id: { type: integer }, product_group_id: { type: integer }, product_type_id: { type: integer }, mTonQty: { type: number }, rTonQty: { type: number }, is_delete: { type: boolean } } } }
    VesselImportInput:
      type: object
      properties:
        vesselId: { type: integer }
        berthId: { type: integer }
        jettyId: { type: integer }
        grossTonnage: { type: number }
        mooringDate: { type: string, format: date-time }
        unmooringDate: { type: string, format: date-time }
        note: { type: string }
        products: { type: array, items: { type: object, properties: { purposeTypeId: { type: integer, description: 1 Loading, 2 Discharge, 3 Discharge/Loading, 4 Spare Part, 5 Passenger, 6 Other }, productId: { type: integer }, productName: { type: string }, mTonQty: { type: number }, rTonQty: { type: number }, passengers: { type: integer } } } }
        statementFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
        shipFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
        cargoManifestFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
        surveyorFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
        certificateQuantityFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
        berthBookingRequestFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
        otherFile: { type: object, properties: { fileId: { type: integer }, isDelete: { type: boolean } } }
  responses:
    Data: { description: '`{ data: ... }`', content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
    PageResponse: { description: Paged list, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Page' } } } } } }
    Error: { description: Error envelope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    File: { description: Binary file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
security:
  - bearerAuth: []
paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in with e-mail and password
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses:
        '200': { description: Tokens and profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LoginResult' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/demo:
    post:
      tags: [Auth]
      security: []
      summary: Sign in as the shared demo account (the frontend calls this automatically for visitors)
      responses:
        '200': { description: Tokens and profile of the demo account, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LoginResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate the refresh token and get a new access token
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses:
        '200': { description: New token pair and the profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LoginResult' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post: { tags: [Auth], summary: Revoke the current session, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /auth/user:
    get: { tags: [Auth], summary: Profile of the signed-in account, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /auth/password/forgot:
    post: { tags: [Auth], security: [], summary: Send a password-reset link (logged, and returned as verifyUrl outside production), requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' }, '404': { $ref: '#/components/responses/Error' } } }
  /auth/password/verify-token:
    post: { tags: [Auth], security: [], summary: Check a reset token, requestBody: { content: { application/json: { schema: { type: object, properties: { password_reset_token: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /auth/password/reset:
    post: { tags: [Auth], security: [], summary: Set a new password with a reset token, requestBody: { content: { application/json: { schema: { type: object, properties: { password_reset_token: { type: string }, new_password: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /verify/send_email:
    post: { tags: [Auth], security: [], summary: Start a vessel-agency registration by verifying an e-mail, requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' }, '409': { $ref: '#/components/responses/Error' } } }
  /verify/email:
    post: { tags: [Auth], security: [], summary: Validate a registration token, requestBody: { content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/register:
    post: { tags: [Auth], security: [], summary: Register a vessel agency (needs the verified token), responses: { '200': { $ref: '#/components/responses/Data' } } }
  # ---------------------------------------------------------------- Account
  /user/term:
    post: { tags: [Account], summary: Accept the terms and conditions, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/update:
    post: { tags: [Account], summary: Update own profile (an e-mail change returns isChangeEmail and needs the mailed code), responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/password:
    post: { tags: [Account], summary: Verify the current password, requestBody: { content: { application/json: { schema: { type: object, properties: { old_password: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/password/reset:
    post: { tags: [Account], summary: Change the password (first login), requestBody: { content: { application/json: { schema: { type: object, properties: { password: { type: string }, confirm_password: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/verify/send_email:
    post: { tags: [Account], summary: Send the e-mail change code, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/{id}:
    get: { tags: [Account], summary: Account detail, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/address/list/{userId}:
    get: { tags: [Account], summary: Billing addresses of a user, parameters: [{ name: userId, in: path, required: true, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/address/{userId}:
    post: { tags: [Account], summary: Add a billing address, parameters: [{ name: userId, in: path, required: true, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    put: { tags: [Account], summary: Update a billing address (body carries id), parameters: [{ name: userId, in: path, required: true, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /user/address/{addressId}:
    delete: { tags: [Account], summary: Delete a billing address, parameters: [{ name: addressId, in: path, required: true, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /contents/terms:
    get: { tags: [Account], security: [], summary: Current terms and conditions, responses: { '200': { $ref: '#/components/responses/Data' } } }
  # ---------------------------------------------------------------- Options
  /options/{kind}:
    get:
      tags: [Options]
      summary: Dropdown sources
      description: 'kinds: countries, provinces, districts?province_id=, subdistricts?district_id= (public); roles, authority, vessel-flags, vessel-types, vessel-owners?q=, vessel-status, vessel-import-status, document-status, agency-document-status, berths, berth-types, jetties, berth-jetties/{berthId}, purposes, purpose-types, locations, products, product-groups, product-types, cargo-types, cargo-wharfage, payment-methods, payment-terms, cargo-owners'
      parameters: [{ name: kind, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Data' } }
  /customers/search:
    get: { tags: [Options], summary: Billing customers for the invoice form, parameters: [{ name: search, in: query, schema: { type: string } }, { name: field, in: query, schema: { type: string, enum: [name, tax_id] } }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  # ---------------------------------------------------------------- Master data
  /admin/master-data/{kind}:
    get:
      tags: [Master data]
      summary: Master data list
      description: 'kinds: berth, port, locate, use-berth, purpose, purpose-type, cargo-type, cargo-wharfage, product, product-type, product-type/list, product-type/type/{groupId}, product-group/list, vessel-type, vessel-flag, pilot/list, tug/list. Filters: status=true|false, vessel_type_id, country_id, purpose_type_id'
      parameters: [{ name: kind, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/search' }, { $ref: '#/components/parameters/order' }]
      responses: { '200': { $ref: '#/components/responses/PageResponse' } }
    post: { tags: [Master data], summary: Create a master record (officers), parameters: [{ name: kind, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/master-data/{kind}/{id}:
    get: { tags: [Master data], summary: Master record, parameters: [{ name: kind, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    put: { tags: [Master data], summary: Update a master record (officers), parameters: [{ name: kind, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/master-data/upload:
    post: { tags: [Files], summary: Upload a master-data file (vessel flag image), requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }, responses: { '200': { description: Stored file, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UploadFile' } } } } } } } }
  # ---------------------------------------------------------------- Users & roles
  /admin/roles:
    get: { tags: [Users & roles], summary: Roles, parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/search' }], responses: { '200': { $ref: '#/components/responses/PageResponse' } } }
    post: { tags: [Users & roles], summary: Create a role, requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, activated: { type: boolean }, permissions: { type: array, items: { type: string } }, roleType: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/roles/{id}:
    get: { tags: [Users & roles], summary: Role with its permission codes, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    put: { tags: [Users & roles], summary: Update a role, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    delete: { tags: [Users & roles], summary: Delete a role (use /{id}/{newRoleId} to move its users), parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/roles/{id}/status:
    put: { tags: [Users & roles], summary: Activate or deactivate a role, parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean } } } } } }, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/users:
    get: { tags: [Users & roles], summary: Officer accounts, parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/search' }, { name: enabled, in: query, schema: { type: string } }, { name: roleId, in: query, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/PageResponse' } } }
    post: { tags: [Users & roles], summary: Create an officer (a password-setup link is mailed/logged), responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/users/{id}:
    get: { tags: [Users & roles], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    put: { tags: [Users & roles], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    delete: { tags: [Users & roles], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/users/{id}/status:
    put: { tags: [Users & roles], summary: Enable or disable an officer, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/vessel-agencies:
    get: { tags: [Users & roles], summary: Vessel agencies, parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/search' }, { name: status, in: query, schema: { type: string, enum: [WaitingApproved, Approved] } }, { name: personType, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/PageResponse' } } }
    post: { tags: [Users & roles], summary: Create an agency, responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/vessel-agencies/{id}:
    get: { tags: [Users & roles], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    put: { tags: [Users & roles], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
    delete: { tags: [Users & roles], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  /admin/vessel-agencies/{id}/approve:
    put: { tags: [Users & roles], summary: Approve a registration, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Data' } } }
  # ---------------------------------------------------------------- Vessels
  /admin/vessels:
